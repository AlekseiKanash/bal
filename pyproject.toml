[project]
name = "bal"
dynamic = ["version"]
description = "LLM Backend Launcher — one entry point for multiple LLM backends such as Ollama and oMLX."
readme = "README.md"
requires-python = ">= 3.11"
dependencies = [
    "psutil >= 5.9",
]
license = { text = "MIT" }
authors = [
    { name = "Aliaksei Kanash", email = "akanash@users.noreply.github.com" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: System :: Monitoring",
]

[project.scripts]
bal = "bal:main"

[build-system]
requires = ["setuptools >= 61.0", "setuptools-scm >= 8.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["bal", "bal.widgets"]

[tool.setuptools_scm]
version_file = "bal/_version.py"
